name: Build ARM64 Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Native ARM64 Executable
        run: npx electron-builder --win --arm64

      - name: Upload Finished Launcher
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-Launcher-ARM64
          path: dist/*.exe
