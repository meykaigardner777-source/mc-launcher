name: Build Aetheria Client Mod

on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/build-client-mod.yml'
  workflow_dispatch:

jobs:
  build-modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build 1.21.1, 1.21.11, 26.1, 26.2, 26.3
        working-directory: mod
        run: gradle buildAllModern --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars-modern
          path: extensions/aetheria-client/mods/*.jar

  build-legacy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build 1.8.9
        working-directory: mod/mc1_8_9
        run: gradle build --no-daemon
      - name: Collect 1.8.9 JAR
        run: |
          mkdir -p out-189
          for f in mod/mc1_8_9/build/libs/*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) continue ;; esac
            cp "$f" out-189/aetheria-client-mod-1.8.9.jar
            break
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jars-legacy
          path: out-189/*.jar

  release:
    needs: [build-modern, build-legacy]
    if: needs.build-modern.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: release-jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Aetheria Client Mod (Build ${{ github.run_number }})"
          body: "Automated multi-version build (1.8.9, 1.21.1, 1.21.11, 26.1, 26.2, 26.3)"
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
