plugins { id 'net.fabricmc.fabric-loom-remap'; id 'java' }
base { archivesName = "${rootProject.archives_base_name}-1.21.1" }
sourceSets { main { java { srcDirs = ['src/main/java', '../common/src/main/java'] } } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }